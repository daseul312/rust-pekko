<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekko-Rust Actor System - 3D Visualization</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            color: #fff;
        }
        #3d-graph {
            width: 100vw;
            height: 100vh;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
            z-index: 100;
        }
        .overlay h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .overlay p {
            opacity: 0.7;
            font-size: 0.85em;
        }
        .stats-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .stats-panel .stat {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 8px;
        }
        .stats-panel .stat:last-child {
            margin-bottom: 0;
        }
        .stats-panel .label {
            opacity: 0.6;
            font-size: 0.8em;
        }
        .stats-panel .value {
            font-weight: bold;
            color: #4fc3f7;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .controls button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .controls button:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.02);
        }
        .controls button.active {
            background: #4fc3f7;
            color: #000;
        }
        .info-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 280px;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 100;
        }
        .info-panel.active {
            display: block;
        }
        .info-panel h3 {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .info-panel p {
            font-size: 0.85em;
            line-height: 1.6;
            opacity: 0.9;
        }
        .info-panel .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-top: 10px;
        }
        .legend {
            position: fixed;
            top: 100px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .legend h4 {
            font-size: 0.8em;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.8em;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .message-trail {
            position: fixed;
            bottom: 150px;
            left: 20px;
            width: 300px;
            max-height: 200px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75em;
            z-index: 100;
        }
        .message-trail .msg {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .message-trail .time { color: #666; }
        .message-trail .from { color: #4ecdc4; }
        .message-trail .to { color: #ff6b6b; }
        .message-trail .type { color: #ffe66d; }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>🦀 Pekko-Rust Actor System 3D</h1>
        <p>드래그로 회전 • 스크롤로 줌 • 노드 클릭으로 상세정보</p>
    </div>

    <div id="3d-graph"></div>

    <div class="legend">
        <h4>ACTOR TYPES</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #4ecdc4;"></div>
            <span>Data Collection</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffe66d;"></div>
            <span>Analysis</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #95e1d3;"></div>
            <span>Trading</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #a29bfe;"></div>
            <span>Infrastructure</span>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat">
            <span class="label">Messages</span>
            <span class="value" id="msgCount">0</span>
        </div>
        <div class="stat">
            <span class="label">Rate</span>
            <span class="value"><span id="msgRate">0</span> /s</span>
        </div>
        <div class="stat">
            <span class="label">Active Nodes</span>
            <span class="value" id="activeNodes">0</span>
        </div>
    </div>

    <div class="message-trail" id="messageTrail"></div>

    <div class="controls">
        <button id="simBtn" onclick="toggleSimulation()">▶️ Start</button>
        <button onclick="resetCamera()">🎯 Reset View</button>
        <button onclick="toggleRotation()">🔄 Auto Rotate</button>
    </div>

    <div class="info-panel" id="infoPanel">
        <h3 id="infoTitle">Actor Info</h3>
        <p id="infoDesc"></p>
        <div class="badge" id="infoBadge"></div>
    </div>

    <script>
        // Actor 데이터 정의
        const actorData = {
            nodes: [
                { id: 'system', name: 'ActorSystem', type: 'infrastructure', 
                  desc: 'Actor 시스템의 핵심. 모든 Actor 생명주기 관리.', val: 20 },
                { id: 'news_collector', name: 'NewsCollector', type: 'data',
                  desc: 'NewsAPI, Alpha Vantage에서 실시간 뉴스 수집.', val: 12 },
                { id: 'data_agent', name: 'DataAgent', type: 'data',
                  desc: '시장 데이터 수집. 가격, 거래량 시계열 처리.', val: 12 },
                { id: 'news_analyzer', name: 'NewsAnalyzer', type: 'analysis',
                  desc: '키워드 기반 감성 분석, 투자 신호 생성.', val: 14 },
                { id: 'ml_agent', name: 'MLAgent', type: 'analysis',
                  desc: '머신러닝 기반 앙상블 예측.', val: 14 },
                { id: 'sentiment_actor', name: 'Sentiment', type: 'analysis',
                  desc: '소셜/뉴스 감성 분석 및 추이 추적.', val: 10 },
                { id: 'prediction_actor', name: 'Prediction', type: 'analysis',
                  desc: '가격 예측 및 투자 의견 생성.', val: 12 },
                { id: 'llm_actor', name: 'LLM Analysis', type: 'analysis',
                  desc: 'OpenAI/Grok 연동 시장 분석.', val: 12 },
                { id: 'persistent_trading', name: 'Trading\n(Persistent)', type: 'trading',
                  desc: 'Event Sourcing 기반 거래. PostgreSQL 저장.', val: 16 },
                { id: 'risk_agent', name: 'RiskAgent', type: 'trading',
                  desc: '포트폴리오 리스크 관리. VaR 계산.', val: 12 },
                { id: 'monitoring', name: 'Monitoring', type: 'infrastructure',
                  desc: '시스템 모니터링, 성능 메트릭.', val: 10 },
                { id: 'postgres', name: 'PostgreSQL', type: 'infrastructure',
                  desc: 'Event Sourcing 저장소.', val: 14 },
            ],
            links: [
                { source: 'system', target: 'news_collector' },
                { source: 'system', target: 'news_analyzer' },
                { source: 'system', target: 'persistent_trading' },
                { source: 'system', target: 'data_agent' },
                { source: 'system', target: 'ml_agent' },
                { source: 'system', target: 'risk_agent' },
                { source: 'system', target: 'monitoring' },
                { source: 'news_collector', target: 'news_analyzer', msg: 'NewsArticle' },
                { source: 'data_agent', target: 'ml_agent', msg: 'MarketData' },
                { source: 'data_agent', target: 'sentiment_actor', msg: 'NewsData' },
                { source: 'news_analyzer', target: 'persistent_trading', msg: 'Signal' },
                { source: 'ml_agent', target: 'persistent_trading', msg: 'Prediction' },
                { source: 'sentiment_actor', target: 'prediction_actor', msg: 'Sentiment' },
                { source: 'prediction_actor', target: 'persistent_trading', msg: 'Signal' },
                { source: 'llm_actor', target: 'prediction_actor', msg: 'Insight' },
                { source: 'persistent_trading', target: 'postgres', msg: 'Event' },
                { source: 'persistent_trading', target: 'risk_agent', msg: 'Order' },
                { source: 'risk_agent', target: 'persistent_trading', msg: 'Approved' },
                { source: 'persistent_trading', target: 'monitoring', msg: 'Metrics' },
                { source: 'risk_agent', target: 'monitoring', msg: 'Alert' },
            ]
        };

        // 타입별 색상
        const typeColors = {
            'data': '#4ecdc4',
            'analysis': '#ffe66d',
            'trading': '#95e1d3',
            'infrastructure': '#a29bfe'
        };

        // 상태 변수
        let isSimulating = false;
        let simulationTimeout = null;
        let messageCount = 0;
        let messageHistory = [];
        let autoRotate = true;
        let activeNodes = new Set();

        // 3D 그래프 초기화
        const Graph = ForceGraph3D()
            (document.getElementById('3d-graph'))
            .graphData(actorData)
            .backgroundColor('#000011')
            .nodeThreeObject(node => {
                // 그룹 생성 (구체 + 텍스트)
                const group = new THREE.Group();
                
                // 구체 생성
                const sphereGeometry = new THREE.SphereGeometry(node.val / 2, 16, 16);
                const sphereMaterial = new THREE.MeshLambertMaterial({
                    color: node.highlight ? '#ffffff' : typeColors[node.type],
                    transparent: true,
                    opacity: 0.85
                });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                node.__sphereMesh = sphere; // 나중에 색상 변경용
                group.add(sphere);
                
                // 텍스트 레이블 생성
                const sprite = new SpriteText(node.name.replace('\\n', '\n'));
                sprite.color = '#ffffff';
                sprite.textHeight = 4;
                sprite.backgroundColor = 'rgba(0,0,0,0.6)';
                sprite.padding = 2;
                sprite.borderRadius = 3;
                sprite.position.y = node.val / 2 + 6; // 구체 위에 표시
                group.add(sprite);
                
                return group;
            })
            .nodeThreeObjectExtend(false)
            .linkColor(link => link.active ? '#4fc3f7' : 'rgba(255,255,255,0.3)')
            .linkWidth(link => link.active ? 3 : 1.5)
            .linkOpacity(0.7)
            .linkDirectionalParticles(link => link.active ? 5 : 0)
            .linkDirectionalParticleSpeed(0.015)
            .linkDirectionalParticleWidth(4)
            .linkDirectionalParticleColor(() => '#4fc3f7')
            .onNodeClick(node => {
                showNodeInfo(node);
                focusOnNode(node);
            })
            .onBackgroundClick(() => {
                document.getElementById('infoPanel').classList.remove('active');
            });

        // 카메라 설정
        Graph.cameraPosition({ x: 0, y: 0, z: 400 });

        // 자동 회전
        let angle = 0;
        function animate() {
            if (autoRotate && !isSimulating) {
                angle += 0.002;
                const distance = 400;
                Graph.cameraPosition({
                    x: distance * Math.sin(angle),
                    y: 50,
                    z: distance * Math.cos(angle)
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 노드 정보 표시
        function showNodeInfo(node) {
            document.getElementById('infoTitle').textContent = node.name;
            document.getElementById('infoDesc').textContent = node.desc;
            document.getElementById('infoBadge').textContent = node.type.toUpperCase();
            document.getElementById('infoBadge').style.background = typeColors[node.type];
            document.getElementById('infoBadge').style.color = node.type === 'analysis' ? '#000' : '#fff';
            document.getElementById('infoPanel').classList.add('active');
        }

        // 노드 포커스
        function focusOnNode(node) {
            const distance = 150;
            const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
            Graph.cameraPosition(
                { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                node,
                1000
            );
        }

        // 노드 하이라이트
        function highlightNode(nodeId) {
            const node = actorData.nodes.find(n => n.id === nodeId);
            if (node && node.__sphereMesh) {
                activeNodes.add(nodeId);
                
                // 원래 색상 저장
                const originalColor = typeColors[node.type];
                
                // 하이라이트 (흰색 + 크기 증가)
                node.__sphereMesh.material.color.set('#ffffff');
                node.__sphereMesh.material.emissive = new THREE.Color('#ffffff');
                node.__sphereMesh.material.emissiveIntensity = 0.5;
                node.__sphereMesh.scale.set(1.3, 1.3, 1.3);
                
                setTimeout(() => {
                    // 원래대로 복귀
                    node.__sphereMesh.material.color.set(originalColor);
                    node.__sphereMesh.material.emissiveIntensity = 0;
                    node.__sphereMesh.scale.set(1, 1, 1);
                }, 500);
            }
        }

        // 링크 활성화 (파티클 효과)
        function activateLink(sourceId, targetId, msgType) {
            const link = actorData.links.find(l => 
                l.source.id === sourceId && l.target.id === targetId
            );
            if (link) {
                link.active = true;
                Graph.linkDirectionalParticles(Graph.linkDirectionalParticles());
                
                setTimeout(() => {
                    link.active = false;
                    Graph.linkDirectionalParticles(Graph.linkDirectionalParticles());
                }, 1000);
            }

            // 메시지 로그
            logMessage(sourceId, targetId, msgType);
            
            // 통계 업데이트
            messageCount++;
            messageHistory.push(Date.now());
            updateStats();
            
            // 타겟 노드 하이라이트
            setTimeout(() => highlightNode(targetId), 200);
        }

        // 메시지 로그
        function logMessage(from, to, type) {
            const trail = document.getElementById('messageTrail');
            const time = new Date().toLocaleTimeString('ko-KR', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
            });
            
            const msg = document.createElement('div');
            msg.className = 'msg';
            msg.innerHTML = `<span class="time">${time}</span> <span class="from">${from}</span> → <span class="to">${to}</span> <span class="type">[${type}]</span>`;
            trail.insertBefore(msg, trail.firstChild);
            
            while (trail.children.length > 30) {
                trail.removeChild(trail.lastChild);
            }
        }

        // 통계 업데이트
        function updateStats() {
            document.getElementById('msgCount').textContent = messageCount;
            
            const now = Date.now();
            messageHistory = messageHistory.filter(t => now - t < 5000);
            const rate = (messageHistory.length / 5).toFixed(1);
            document.getElementById('msgRate').textContent = rate;
            
            document.getElementById('activeNodes').textContent = activeNodes.size;
        }

        // 시뮬레이션 시나리오
        const scenarios = [
            { from: 'news_collector', to: 'news_analyzer', msg: 'NewsArticle' },
            { from: 'news_analyzer', to: 'persistent_trading', msg: 'BuySignal' },
            { from: 'data_agent', to: 'ml_agent', msg: 'MarketData' },
            { from: 'ml_agent', to: 'persistent_trading', msg: 'Prediction' },
            { from: 'persistent_trading', to: 'postgres', msg: 'SaveEvent' },
            { from: 'persistent_trading', to: 'risk_agent', msg: 'CheckRisk' },
            { from: 'risk_agent', to: 'persistent_trading', msg: 'Approved' },
            { from: 'sentiment_actor', to: 'prediction_actor', msg: 'Score' },
            { from: 'prediction_actor', to: 'persistent_trading', msg: 'Signal' },
            { from: 'persistent_trading', to: 'monitoring', msg: 'Metrics' },
            { from: 'llm_actor', to: 'prediction_actor', msg: 'Insight' },
            { from: 'news_collector', to: 'news_analyzer', msg: 'NVDA_News' },
            { from: 'news_analyzer', to: 'persistent_trading', msg: 'SellSignal' },
            { from: 'data_agent', to: 'sentiment_actor', msg: 'SocialData' },
            { from: 'risk_agent', to: 'monitoring', msg: 'RiskAlert' },
        ];

        function simulateMessage() {
            const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            highlightNode(scenario.from);
            activateLink(scenario.from, scenario.to, scenario.msg);
        }

        function toggleSimulation() {
            const btn = document.getElementById('simBtn');
            if (isSimulating) {
                clearTimeout(simulationTimeout);
                isSimulating = false;
                btn.textContent = '▶️ Start';
                btn.classList.remove('active');
            } else {
                isSimulating = true;
                btn.textContent = '⏹️ Stop';
                btn.classList.add('active');
                
                function scheduleNext() {
                    if (!isSimulating) return;
                    simulateMessage();
                    simulationTimeout = setTimeout(scheduleNext, 400 + Math.random() * 600);
                }
                scheduleNext();
            }
        }

        function resetCamera() {
            Graph.cameraPosition({ x: 0, y: 0, z: 400 }, { x: 0, y: 0, z: 0 }, 1000);
            angle = 0;
        }

        function toggleRotation() {
            autoRotate = !autoRotate;
        }

        // 주기적 통계 업데이트
        setInterval(updateStats, 1000);

        // 🚀 자동 시작!
        setTimeout(() => {
            toggleSimulation();
            console.log('🎬 3D Simulation started!');
        }, 2000);
    </script>
</body>
</html>
