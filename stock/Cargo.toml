[package]
name = "stock"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"

# Pekko Actor System
pekko-actor = { path = "../pekko-actor" }
pekko-persistence = { path = "../pekko-persistence", features = ["coredb-backend"] }
pekko-streams = { path = "../pekko-streams" }

# Dioxus dependencies
dioxus = "0.6"
dioxus-desktop = "0.6"
dioxus-router = "0.6"

# Chart and UI dependencies
plotters = "0.3"
chrono-tz = "0.8"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3"
