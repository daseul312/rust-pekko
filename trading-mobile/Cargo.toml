[package]
name = "trading-mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["mobile"] }
dioxus-mobile = "0.6"
dioxus-desktop = "0.6"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[[bin]]
name = "trading-mobile"
path = "src/main.rs"
pekko-actor = { path = "../pekko-actor" }
pekko-ml4t-system = { path = "../pekko-ml4t-system" }

# Stock trading
stock = { path = "../stock" }

[lib]
name = "trading_mobile"
crate-type = ["cdylib", "rlib"]
