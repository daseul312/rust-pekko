[package]
name = "pekko-remoting"
version = "0.1.0"
edition = "2021"
authors = ["Pekko Rust Contributors"]
description = "Remoting and clustering for Pekko actors"
license = "Apache-2.0"

[dependencies]
pekko-actor = { path = "../pekko-actor" }

# Async runtime and networking
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
prost-types = "0.12"
bincode = "1.3"

# Networking
hyper = { version = "1.0", features = ["full"] }
tonic = "0.11"
quinn = { version = "0.10", optional = true }  # QUIC support
rustls = { version = "0.21", optional = true }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
bytes = "1.0"
dashmap = "5.0"
parking_lot = "0.12"

# Configuration
config = "0.14"
toml = "0.8"

# Compression (optional)
lz4_flex = { version = "0.11", optional = true }
flate2 = { version = "1.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
tempfile = "3.0"
tracing-subscriber = "0.3"

[build-dependencies]
prost-build = "0.12"
tonic-build = "0.11"

[features]
default = ["compression"]
compression = ["lz4_flex", "flate2"]
quic = ["quinn"]
tls = ["rustls"]