[package]
name = "pekko-streams"
version = "0.1.0"
edition = "2021"
authors = ["Pekko Rust Contributors"]
description = "Reactive Streams implementation for Pekko - backpressure-aware stream processing"
license = "Apache-2.0"

[dependencies]
pekko-actor = { path = "../pekko-actor", optional = true }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Utilities
pin-project-lite = "0.2"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
pekko-actor = ["dep:pekko-actor"]
